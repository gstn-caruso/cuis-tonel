name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

# El VM ya no se vendorea: se baja del release oficial de OpenSmalltalk (misma build
# que usa qSmalltalk). La imagen Cuis se toma del repo gstn-caruso/qSmalltalk.
env:
  VM_RELEASE: "202603271636"
  VM_BASE_URL: "https://github.com/OpenSmalltalk/opensmalltalk-vm/releases/download"

jobs:
  test-linux-amd64:
    name: Tests (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout cuis-tonel
        uses: actions/checkout@v4
        with:
          path: cuis-tonel

      - name: Checkout qSmalltalk (image)
        uses: actions/checkout@v4
        with:
          repository: gstn-caruso/qSmalltalk
          path: qSmalltalk
          fetch-depth: 1

      - name: Download VM (linux x64)
        run: |
          curl -fsSL -o /tmp/vm.tar.gz \
            "${VM_BASE_URL}/${VM_RELEASE}/squeak.cog.spur_linux64x64.tar.gz"
          mkdir -p /tmp/vm && tar xzf /tmp/vm.tar.gz -C /tmp/vm
          VM=$(find /tmp/vm -maxdepth 2 -type f -name squeak | head -1)
          chmod +x "$VM"
          echo "CUIS_VM=${VM}" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          CUIS_DEV_ROOT="$GITHUB_WORKSPACE/qSmalltalk" \
          CUIS_VM_ARGS="-vm-sound-null -vm-display-null" \
          bash cuis-tonel/.github/scripts/run-tests.sh

  test-linux-arm64:
    name: Tests (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout cuis-tonel
        uses: actions/checkout@v4
        with:
          path: cuis-tonel

      - name: Checkout qSmalltalk (image)
        uses: actions/checkout@v4
        with:
          repository: gstn-caruso/qSmalltalk
          path: qSmalltalk
          fetch-depth: 1

      - name: Download VM (linux arm64)
        run: |
          curl -fsSL -o /tmp/vm.tar.gz \
            "${VM_BASE_URL}/${VM_RELEASE}/squeak.cog.spur_linux64ARMv8.tar.gz"
          mkdir -p /tmp/vm && tar xzf /tmp/vm.tar.gz -C /tmp/vm
          VM=$(find /tmp/vm -maxdepth 2 -type f -name squeak | head -1)
          chmod +x "$VM"
          echo "CUIS_VM=${VM}" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          CUIS_DEV_ROOT="$GITHUB_WORKSPACE/qSmalltalk" \
          CUIS_VM_ARGS="-vm-sound-null -vm-display-null" \
          bash cuis-tonel/.github/scripts/run-tests.sh

  release:
    name: Release
    needs: [test-linux-amd64, test-linux-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout cuis-tonel
        uses: actions/checkout@v4
        with:
          path: cuis-tonel

      - name: Generate version tag
        id: version
        run: |
          echo "tag=$(date -u +'%Y.%m.%d')-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd cuis-tonel
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "cuis-tonel ${{ steps.version.outputs.tag }}" \
            --notes "$(printf 'Commit: %s\n\n%s' "$GITHUB_SHA" "$COMMIT_MSG")" \
            dist/Tonel.pck.st
